name: CI

on:
  push:
    branches: [main, creacion_auditoria, implementacion_forense]
  pull_request:
    branches: [main, creacion_auditoria]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        backend: [sqlite, mysql]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpassword
          MYSQL_DATABASE: crm_lab
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --protocol=tcp"
          --health-interval=5s --health-timeout=3s --health-retries=30
    env:
      DJANGO_SETTINGS_MODULE: dcrm.settings.test_${{ matrix.backend }}
      SECRET_KEY: test-secret-key-for-ci
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      DB_NAME: crm_lab
      DB_USER: root
      DB_PASSWORD: testpassword
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y default-libmysqlclient-dev pkg-config
          pip install -r requirements.lock
      - name: Verify effective engine, configuration and migrations
        run: |
          python manage.py shell -c "from django.db import connection; assert connection.vendor == '${{ matrix.backend }}'"
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput
      - name: Test Django, migrations and evidence pipeline
        run: python manage.py test website --noinput --verbosity=1
      - name: Check Bash entrypoints
        run: |
          bash -n adquirir_evidencias.sh verificar_integridad.sh forensic_lab/tools/acquire_case.sh forensic_lab/tools/verify_evidence.sh forensic_lab/environments/provision_mysql.sh
          bash adquirir_evidencias.sh --help
          bash verificar_integridad.sh --help
