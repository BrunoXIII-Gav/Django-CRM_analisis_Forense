# Optional override for environment B. Use an existing, external case directory.
services:
  web:
    environment:
      FORENSIC_CASES_ROOT: /cases
    volumes:
      - type: bind
        source: ${FORENSIC_CASES_HOST_DIR:?Set an absolute path to the existing case directory}
        target: /cases
        read_only: true
        bind:
          create_host_path: false
